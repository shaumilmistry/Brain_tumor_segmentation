{% extends 'index.html' %}

{% block title %}Prediction Result{% endblock title %}

{% block body %}
<div class="container mt-5">
    <h2 class="mb-4">Prediction Result</h2>

    <div class="row">
        <div class="col-md-6">
            <h5>Original Image</h5>
            <img src="{{ image.image.url }}" alt="Original" class="img-fluid border">
        </div>
        <div class="col-md-6">
            <h5>Segmentation Mask</h5>
            <img src="{{ mask }}" alt="Predicted Mask" class="img-fluid border">
        </div>
    </div>

    <div class="mt-4">
        <a href="{% url 'upload' %}" class="btn btn-secondary">Try Another Image</a>
    </div>
</div>
{% endblock body %}
